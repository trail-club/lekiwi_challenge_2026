# so101_reach_to_point のパラメータ（LeKiwi + SO-101 結合構成）。
#
# ★ joint_prefix は launch から渡される。ここには書かない
#   （結合 URDF・ros2_controllers.yaml と必ず一致させる必要があるため、
#     一箇所（launch）でだけ決める）。

so101_reach_to_point:
  ros__parameters:
    # base_link / tip_link は「接頭辞なし」で書く。joint_prefix が前置される。
    base_link: base_link
    tip_link: gripper_frame_link

    target_topic: /so101/reach_target
    # RViz の "Publish Point" は PointStamped を出す（PoseStamped ではない）。
    # 型が違うので remap では繋がらない。ノードが両方を購読する。
    # ★ RViz の Fixed Frame を map にしておくこと。
    point_target_topic: /clicked_point
    subscribe_clicked_point: true

    # 目標はこのフレームでのみ受け付ける。
    # ★ 精度が出ないうちに動かしたい場合は odom か base_footprint にする。
    #   map->odom は slam_toolbox 由来で 2-5cm の誤差があり、それがそのまま
    #   手先に乗る。odom->base_footprint はオドメトリ積分なので短時間なら正確。
    expected_frame: map

    tf_timeout: 0.5
    # ★ 最重要の沈黙故障対策。slam_toolbox が死んでも tf2 は凍った map->odom を
    #   返し続けるので、これが無いと過去の世界座標で黙って解いてしまう。
    tf_max_age: 1.0

    # ★ 安い早期棄却のためだけの値。数 m 先の目標に対して 200 回反復してから
    #   「届かない」と言うのを避けるためのもの。
    #   結合 URDF から実測した到達範囲は arm_base_link 基準で 0.007〜0.543m
    #   （関節上限を余白 0.10 込みで格子探索）。ゼロ姿勢だけで 0.452m あるので、
    #   これを 0.30 などにすると**到達可能な点をほとんど棄却してしまう**。
    #
    # ★ これは転倒対策ではない。半径では安全な姿勢と危険な姿勢を区別できない。
    #   転倒は joint_limit_overrides（実機で手動確認）で抑えること。
    #   天板 0.216m 角に対し支持多角形は車輪円（半径 0.125m）しかない。
    max_reach_radius: 0.55
    # ★ これは「床」のガードであって機体を守るものではない。
    #   ベースプレートは base_footprint で z ∈ [0.033, 0.040]、
    #   アームが載る plate2 の上面は 0.092。0.02 だとプレートの中を指す目標が通る。
    #   0.035 まで上げてプレート本体は弾くが、その上の機体構造 (LiDAR 0.070、
    #   plate2 0.092) は高さだけでは判別できない。そこは joint_limit_overrides
    #   (実機で手動確認) の担当。
    z_floor: 0.035
    floor_frame: base_footprint

    min_command_interval: 1.0
    # 遅く動かす。約0.75kg のアームがオムニ車輪の上で振れると機体が実際に
    # ずれるが、base_driver は指令値を積分しているのでオドメトリには現れない。
    max_joint_speed: 0.6
    min_reach_duration: 1.0
    max_reach_duration: 12.0

    require_stationary_base: true
    odom_topic: /odom
    base_linear_tolerance: 0.01
    base_angular_tolerance: 0.05
    base_motion_tolerance: 0.02
    base_watch_rate: 10.0

    # ★ 実機で手動確認してから埋めること。
    #   laser_link と arm_mount_link は xy で 44mm しか離れていない。
    #   形式は "関節名:下限:上限"。URDF の可動範囲との積集合を取る。
    #   例: ["arm_shoulder_pan_joint:-1.2:1.2"]
    joint_limit_overrides: [""]

    # ★ stow姿勢（JointStateの実測値）。
    #   順序は shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll。
    #   gripper は別アクションで stow_gripper_position へ送る。
    #
    #   arm_elbow_flex_joint:     1.7422605412215924
    #   arm_gripper_joint:        0.0363150867823765
    #   arm_shoulder_lift_joint: -1.7951958020513104
    #   arm_shoulder_pan_joint:   0.03222146311374147
    #   arm_wrist_flex_joint:    -1.7721804712557807
    #   arm_wrist_roll_joint:     1.370946537720381
    stow_positions:
      [0.03222146311374147, -1.7951958020513104, 1.7422605412215924,
       -1.7721804712557807, 1.370946537720381]
    stow_gripper_position: 0.0363150867823765

    solver_tolerance: 0.005
    solver_max_iterations: 200
    solver_step: 0.02
    solver_max_joint_step: 0.10
    solver_damping: 0.03
    joint_limit_margin: 0.10
    solver_stall_tolerance: 0.0001
    solver_stall_patience: 10
