# 分割バス機: 7.4V アームと 12V ホイールを別々のドライバで所有する。
services:
  robot:
    volumes:
      - type: bind
        source: ${LEKIWI_DEVICE:?docker/robot/.env に /dev/serial/by-id/ のパスを書くこと}
        target: /dev/lekiwi
        bind:
          create_host_path: false
      - type: bind
        source: ${SO101_DEVICE:?docker/robot/.env に /dev/serial/by-id/ のパスを書くこと}
        target: /dev/so101_follower
        bind:
          create_host_path: false
